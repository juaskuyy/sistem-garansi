<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Garansi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<section class="card">
<h1>Form Garansi</h1>
<form id="form">
<input name="name" placeholder="Nama" required>
<input name="whatsapp" placeholder="Nomor WhatsApp" required>
<input name="product" placeholder="Produk" required>
<input name="account" placeholder="Email/Akun">
<input name="orderId" placeholder="ID Order">
<input name="orderDate" type="date">
<input name="duration" placeholder="Durasi">
<select name="claimType">
<option>Garansi</option>
<option>Kendala Login</option>
<option>Akun Bermasalah</option>
</select>
<textarea name="problem" placeholder="Jelaskan kendala" required></textarea>
<button type="submit">Kirim Pengajuan</button>
</form>
<div id="message"></div>
</section>
</main>
<script>
const API="https://garansi-api.jhonyoga01.workers.dev";
document.getElementById("form").addEventListener("submit",async(event)=>{
  event.preventDefault();
  const message=document.getElementById("message");
  message.textContent="Mengirim...";
  try{
    const data=Object.fromEntries(new FormData(event.target).entries());
    const response=await fetch(`${API}/api/claims`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    const result=await response.json();
    if(!response.ok||!result.success) throw new Error(result.message||"Pengajuan gagal.");
    message.textContent=`${result.message} ID: ${result.warrantyId}`;
    event.target.reset();
  }catch(error){
    message.textContent=error.message||"Failed to fetch";
  }
});
</script>
</body>
</html>
